[project]
name = "tbm-model"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "numpy==2.5.5",
    "opencv-python==5.1.0.95",
    "openpyxl==3.1.5",
    "paho-mqtt==2.1.0",
    "pillow==12.3.0",
    "pyserial==3.5",
    "python-can==4.6.1",
]

[dependency-groups]
camera-discovery = [
    "onvif-zeep>=0.2.12",
    "wsdiscovery>=2.1.2",
]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
]
odrive-tools = [
    "odrive>=0.6.11.post1",
]

[tool.uv]
# Plain `uv sync` / `uv run` installs the ground-station runtime only.
# Developer and field tools are opt-in via --group.
default-groups = []
# Pin indirect dependencies too: python-can's to the original GUI venv's
# versions, and openpyxl's to the version locked today.
constraint-dependencies = [
    "coverage==7.17.4",
    "et-xmlfile==2.0.0",
    "packaging==26.3",
    "typing-extensions==4.16.0",
    "wrapt==1.17.3",
]

[tool.pytest.ini_options]
# Tests live in the flat root-level tests/ folder. importlib mode: pytest
# imports test files without changing sys.path (recommended for new projects).
# pythonpath makes the GUI's src/ importable (import GUI_menus.dashboard_panel
# etc. work the same as when the GUI runs).
testpaths = ["tests"]
pythonpath = ["Control_GUI/GUI_V3_3/src"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
branch = true
source = ["Control_GUI/GUI_V3_3/src", "Camera_System"]

[tool.coverage.report]
show_missing = true
# Also report untested files in folders without __init__.py (cutterhead_pcan).
include_namespace_packages = true
